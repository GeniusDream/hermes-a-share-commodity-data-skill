services:
  postgres:
    image: postgres:16-alpine
    container_name: a-share-daily-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: a_share_daily
      POSTGRES_USER: a_share
      POSTGRES_PASSWORD: a_share_daily_local
      TZ: Asia/Shanghai
    ports:
      - "15432:5432"
    volumes:
      - a_share_daily_pgdata:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U a_share -d a_share_daily"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  a_share_daily_pgdata:
